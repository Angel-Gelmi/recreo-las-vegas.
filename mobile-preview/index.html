<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Comparar V1 y V2 · Las Vegas</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:14px/1.5 system-ui}header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #292929;flex-wrap:wrap}h1{font-size:18px;margin:0}p{margin:4px 0 0;color:#b4b4b4;font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:inherit;min-height:44px;border-radius:8px;padding:10px 14px;border:1px solid #444;color:#b4b4b4;background:none;text-decoration:none;cursor:pointer}button[aria-pressed=true]{color:#000;background:#fff;border-color:#fff}main{display:grid;justify-content:center;padding:24px 12px}iframe{width:390px;max-width:calc(100vw - 24px);height:844px;border:1px solid #444;border-radius:24px;background:#000}body.wide main{display:block}body.wide iframe{width:100%;max-width:none;height:calc(100dvh - 150px);min-height:650px;border-radius:8px}.caption{max-width:560px;padding:16px 8px;margin:auto}.caption strong{color:white;font-weight:500}@media(max-width:600px){header{padding:12px;gap:12px}.controls{width:100%}button,a{flex:1;text-align:center;font-size:12px;padding:10px 8px}main{padding:12px 0}iframe{width:100vw;max-width:100vw;height:calc(100dvh - 160px);min-height:600px;border-radius:0;border-inline:0}#resize{display:none}}
</style></head><body><header><div><h1>Las Vegas · Comparar versiones</h1><p>Vista previa local. Tu página publicada sigue igual.</p></div><div class="controls"><button id="v1" aria-pressed="false">V1 · Actual</button><button id="v2" aria-pressed="true">V2 · Móvil</button><button id="resize" aria-pressed="false">Ver escritorio</button><a id="direct" href="v2/demo.html" target="_blank" rel="noopener">Abrir aparte</a></div></header><main><iframe id="preview" src="v2/demo.html" title="Versión 2 móvil de Las Vegas"></iframe></main><p class="caption"><strong>Prueba sin riesgo:</strong> cambia de cuenta, toca el 1 de noviembre y abre WhatsApp. En diciembre verás Nochebuena y Navidad. Las reservas y pagos de esta demostración son ejemplos; no se conecta a Firebase.</p><script>
const frame=document.getElementById('preview');let current='v2';const positions={};
for(const version of ['v1','v2'])document.getElementById(version).onclick=()=>{current=version;frame.src=version+'/demo.html';frame.title=version==='v1'?'Versión 1 actual de Las Vegas':'Versión 2 móvil de Las Vegas';document.getElementById('direct').href=frame.src;for(const v of ['v1','v2'])document.getElementById(v).setAttribute('aria-pressed',String(v===version));};
document.getElementById('resize').onclick=e=>{const wide=document.body.classList.toggle('wide');e.currentTarget.setAttribute('aria-pressed',String(wide));e.currentTarget.textContent=wide?'Ver celular':'Ver escritorio';};
</script></body></html>
